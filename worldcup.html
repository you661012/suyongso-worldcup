<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}</style>
<title>수용소 월드컵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Bungee&family=Gothic+A1:wght@400;700;900&display=swap">
<style>
/* Layout: fighting-game VS screen. Red corner vs blue corner split on a diagonal, gold reserved for the champion. Single dark arcade look by choice. */
:root {
  --ink: #0e0c1d;
  --ink-2: #1a1733;
  --paper: #f6f1ff;
  --muted: #a49cc4;
  --red: #ff3d5a;
  --blue: #2f8bff;
  --gold: #ffc83d;
  --display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --arcade: "Bungee", "Black Han Sans", Impact, sans-serif;
  --body: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ink);
  color: var(--paper);
  font-family: var(--body);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(circle at 20% 10%, color-mix(in srgb, var(--red) 22%, transparent), transparent 45%),
    radial-gradient(circle at 80% 90%, color-mix(in srgb, var(--blue) 22%, transparent), transparent 45%),
    radial-gradient(color-mix(in srgb, var(--paper) 7%, transparent) 1px, transparent 1.5px) 0 0 / 14px 14px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .side:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.app {
  position: relative; z-index: 1;
  height: 100%;
  display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  box-sizing: border-box;
}
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ---------- Intro ---------- */
.home { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 12px; z-index: 3; font-family: var(--display); font-size: 1rem; color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--ink-2); background: var(--ink-2); }
.home:hover { color: var(--paper); }
.intro { align-items: center; justify-content: center; gap: 22px; text-align: center; overflow: hidden; }
.eyebrow { font-family: var(--arcade); font-size: 0.8rem; letter-spacing: 0.18em; color: var(--gold); }
.logo { font-family: var(--display); line-height: 0.92; margin: 0; font-weight: 400; text-wrap: balance; }
.logo span { display: block; animation: slam 0.6s cubic-bezier(.2,1.6,.4,1) both; }
.logo .l1 { font-size: clamp(2rem, 7vw, 4rem); color: var(--muted); animation-delay: 0.05s; }
.logo .l2 { font-size: clamp(4rem, 17vw, 10rem); color: var(--paper); text-shadow: 6px 6px 0 var(--red), -6px -6px 0 var(--blue); animation-delay: 0.25s; }
.logo .l3 { font-size: clamp(2.2rem, 9vw, 5rem); color: var(--gold); animation-delay: 0.45s; letter-spacing: 0.08em; }
@keyframes slam { from { transform: scale(3) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }

.reel { width: calc(100% + 32px); display: grid; gap: 10px; transform: rotate(-4deg); }
.reel-row { display: flex; gap: 10px; width: max-content; animation: drift 38s linear infinite; }
.reel-row.rev { animation-direction: reverse; }
.reel-row img { width: 96px; height: 120px; object-fit: cover; border-radius: 6px; filter: saturate(1.2); }
@keyframes drift { to { transform: translateX(-50%); } }

.start {
  font-family: var(--display); font-size: 1.6rem;
  padding: 14px 44px; border: 0; border-radius: 999px;
  background: var(--gold); color: var(--ink);
  box-shadow: 0 6px 0 color-mix(in srgb, var(--gold) 50%, #000), 0 0 40px color-mix(in srgb, var(--gold) 45%, transparent);
  animation: pulse 1.4s ease-in-out infinite;
}
.start:active { transform: translateY(4px); box-shadow: 0 2px 0 color-mix(in srgb, var(--gold) 50%, #000); }
@keyframes pulse { 50% { transform: scale(1.06); } }
.rules { color: var(--muted); font-size: 0.9rem; line-height: 1.6; margin: 0; }
.rules b { color: var(--paper); }

/* ---------- Match ---------- */
.hud { display: flex; align-items: center; gap: 14px; padding-bottom: 10px; }
.hud .round { font-family: var(--display); font-size: 1.7rem; color: var(--gold); }
.hud .count { font-family: var(--arcade); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 8px; border-radius: 99px; background: var(--ink-2); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--red), var(--gold), var(--blue)); transition: width 0.5s ease; }

.stage { flex: 1; min-height: 0; position: relative; display: grid; grid-template-columns: 1fr 1fr; }
.side {
  position: relative; overflow: hidden; border: 0; padding: 0; margin: 0;
  background: var(--ink-2); text-align: left;
  transition: transform 0.55s cubic-bezier(.3,1.4,.5,1), filter 0.4s, opacity 0.4s;
}
.side.a { clip-path: polygon(0 0, 100% 0, 88% 100%, 0 100%); margin-right: -6%; }
.side.b { clip-path: polygon(12% 0, 100% 0, 100% 100%, 0 100%); margin-left: -6%; }
.side img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
.side::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(to top, color-mix(in srgb, var(--ink) 92%, transparent) 0%, transparent 42%);
}
.side.a::before, .side.b::before {
  content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  box-shadow: inset 0 0 0 5px var(--c), inset 0 0 60px color-mix(in srgb, var(--c) 55%, transparent);
}
.side.a { --c: var(--red); }
.side.b { --c: var(--blue); }
@media (hover: hover) { .side:hover img { transform: scale(1.06); } }
.cap { position: absolute; z-index: 2; bottom: 0; left: 0; right: 0; padding: 18px 22px; display: grid; gap: 4px; }
.side.a .cap { padding-right: 16%; }
.side.b .cap { padding-left: 16%; text-align: right; }
.cap .tag { font-family: var(--arcade); font-size: 0.75rem; letter-spacing: 0.14em; color: var(--c); }
.cap .t { font-family: var(--display); font-size: clamp(1.4rem, 3.4vw, 2.4rem); line-height: 1.05; text-wrap: balance; }
.cap .d { font-size: 0.95rem; color: color-mix(in srgb, var(--paper) 82%, transparent); line-height: 1.4; }

.vs {
  position: absolute; left: 50%; top: 50%; z-index: 5; pointer-events: none;
  font-family: var(--arcade); font-size: clamp(3rem, 10vw, 7rem); line-height: 1;
  color: var(--gold); transform: translate(-50%, -50%);
  text-shadow: 4px 4px 0 var(--red), -4px -4px 0 var(--blue), 0 0 30px var(--gold);
}
.stamp {
  position: absolute; z-index: 4; left: 50%; top: 40%;
  font-family: var(--display); font-size: clamp(3rem, 9vw, 6rem);
  color: var(--gold); border: 6px solid var(--gold); border-radius: 12px; padding: 0 18px;
  transform: translate(-50%, -50%) rotate(-12deg) scale(0); opacity: 0;
  background: color-mix(in srgb, var(--ink) 55%, transparent);
  text-shadow: 0 0 20px var(--gold);
}

/* entrance */
.stage.enter .side.a { animation: inL 0.5s cubic-bezier(.2,1.3,.4,1) both; }
.stage.enter .side.b { animation: inR 0.5s cubic-bezier(.2,1.3,.4,1) both; }
.stage.enter .vs { animation: vs 0.7s 0.35s cubic-bezier(.2,2,.4,1) both; }
.stage.enter { animation: shake 0.35s 0.55s both; }
@keyframes inL { from { transform: translateX(-110%) skewX(-12deg); } }
@keyframes inR { from { transform: translateX(110%) skewX(-12deg); } }
@keyframes vs { from { transform: translate(-50%, -50%) scale(5) rotate(-30deg); opacity: 0; } }
@keyframes shake {
  20% { transform: translate(-8px, 4px); } 40% { transform: translate(7px, -5px); }
  60% { transform: translate(-5px, 3px); } 80% { transform: translate(3px, -2px); }
}

/* resolution */
.side.win { z-index: 3; transform: scale(1.03); }
.side.win .stamp { animation: stamp 0.45s 0.1s cubic-bezier(.2,1.8,.4,1) both; }
@keyframes stamp { to { transform: translate(-50%, -50%) rotate(-12deg) scale(1); opacity: 1; } }
.side.a.lose { transform: translate(-30%, 120%) rotate(-24deg); filter: grayscale(1) brightness(0.5); }
.side.b.lose { transform: translate(30%, 120%) rotate(24deg); filter: grayscale(1) brightness(0.5); }
.stage.done .vs { transition: opacity 0.2s; opacity: 0; }

.flash { position: fixed; inset: 0; z-index: 20; background: var(--paper); opacity: 0; pointer-events: none; }
.flash.go { animation: flash 0.35s ease-out; }
@keyframes flash { 0% { opacity: 0.7; } 100% { opacity: 0; } }

/* ---------- Banner ---------- */
.banner {
  position: fixed; inset: 0; z-index: 15; display: grid; place-items: center; pointer-events: none;
  background: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--red) 85%, var(--ink)) 0 28px, color-mix(in srgb, var(--red) 65%, var(--ink)) 28px 56px);
  clip-path: polygon(0 38%, 100% 30%, 100% 62%, 0 70%);
}
.banner.show { animation: bannerIn 1.5s cubic-bezier(.6,0,.2,1) both; }
.banner .inner { display: grid; justify-items: center; gap: 6px; }
.banner .big { font-family: var(--display); font-size: clamp(4rem, 16vw, 9rem); line-height: 1; color: var(--paper); text-shadow: 6px 6px 0 var(--ink); }
.banner .small { font-family: var(--arcade); font-size: 0.9rem; letter-spacing: 0.2em; color: var(--gold); }
.banner img { width: 88px; height: 88px; object-fit: cover; border-radius: 50%; border: 4px solid var(--gold); }
@keyframes bannerIn {
  0% { transform: translateX(100%); } 22% { transform: translateX(0); }
  78% { transform: translateX(0); } 100% { transform: translateX(-100%); }
}

/* ---------- Champion ---------- */
.champ { align-items: center; justify-content: center; gap: 16px; text-align: center; overflow-y: auto; position: relative; }
.rays {
  position: fixed; left: 50%; top: 42%; width: 220vmax; height: 220vmax; z-index: -1; pointer-events: none;
  transform: translate(-50%, -50%);
  background: repeating-conic-gradient(color-mix(in srgb, var(--gold) 16%, transparent) 0 8deg, transparent 8deg 20deg);
  animation: spin 24s linear infinite;
  -webkit-mask: radial-gradient(circle, #000 0, transparent 40%); mask: radial-gradient(circle, #000 0, transparent 40%);
}
@keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
.champ .eyebrow { animation: slam 0.5s 0.2s both; }
.frame { position: relative; width: min(280px, 62vw); aspect-ratio: 3 / 4; max-width: 100%; animation: rise 0.9s cubic-bezier(.2,1.4,.4,1) both; }
.frame img { width: 100%; height: 100%; object-fit: cover; border-radius: 14px; border: 6px solid var(--gold); box-shadow: 0 0 0 3px var(--ink), 0 0 70px color-mix(in srgb, var(--gold) 70%, transparent); box-sizing: border-box; }
.crown { position: absolute; left: 50%; top: -58px; width: 96px; transform: translateX(-50%); animation: crown 0.7s 0.7s cubic-bezier(.2,1.8,.4,1) both; filter: drop-shadow(0 4px 10px color-mix(in srgb, var(--gold) 60%, transparent)); }
@keyframes rise { from { transform: translateY(40px) scale(0.6); opacity: 0; } }
@keyframes crown { from { transform: translate(-50%, -160px) rotate(-30deg); opacity: 0; } }
.champ h2 { font-family: var(--display); font-weight: 400; font-size: clamp(2rem, 7vw, 3.4rem); margin: 0; line-height: 1.05; text-wrap: balance; color: var(--gold); }
.champ .d { margin: 0; color: var(--paper); font-size: 1.05rem; }
.trail { display: grid; gap: 8px; justify-items: center; }
.trail .lbl { font-family: var(--arcade); font-size: 0.75rem; letter-spacing: 0.16em; color: var(--muted); }
.trail .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.trail img { width: 52px; height: 52px; object-fit: cover; border-radius: 50%; filter: grayscale(1); border: 2px solid var(--muted); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn { font-family: var(--display); font-size: 1.1rem; padding: 10px 24px; border-radius: 999px; border: 2px solid var(--paper); background: transparent; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--ink); }
.toast { min-height: 1.2em; margin: 0; font-size: 0.9rem; color: var(--gold); }

#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 18; pointer-events: none; }

/* ---------- Phone ---------- */
@media (max-width: 720px), (max-aspect-ratio: 4/5) {
  .stage { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  .side.a { clip-path: polygon(0 0, 100% 0, 100% 86%, 0 100%); margin: 0 0 -7% 0; }
  .side.b { clip-path: polygon(0 14%, 100% 0, 100% 100%, 0 100%); margin: -7% 0 0 0; }
  .side.a .cap { padding: 12px 16px 22% 16px; }
  .side.b .cap { padding: 12px 16px 14px 16px; text-align: left; }
  .side.a .cap { bottom: 0; }
  .stage.enter .side.a { animation-name: inT; }
  .stage.enter .side.b { animation-name: inB; }
  .side.a.lose { transform: translate(-120%, -10%) rotate(-20deg); }
  .side.b.lose { transform: translate(120%, 10%) rotate(20deg); }
  .cap .d { font-size: 0.85rem; }
  .hud .round { font-size: 1.35rem; }
}
@keyframes inT { from { transform: translateY(-110%) skewY(-8deg); } }
@keyframes inB { from { transform: translateY(110%) skewY(-8deg); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>

</head>
<body>
<div class="app">
  <section class="screen intro" id="intro">
    <a class="home" href="./">← 게임센터</a>
    <div class="eyebrow">ROUND OF 16 · 15 ENTRIES</div>
    <h1 class="logo"><span class="l1">제1회</span><span class="l2">수용소</span><span class="l3">월드컵</span></h1>
    <div class="reel" aria-hidden="true"><div class="reel-row" id="reel1"></div><div class="reel-row rev" id="reel2"></div></div>
    <p class="rules">사진 15장 중 단 한 장만 살아남는다.<br>더 웃긴 쪽을 <b>탭</b>하거나 키보드 <b>← →</b></p>
    <button class="start" id="startBtn" type="button">입장하기</button>
  </section>

  <section class="screen" id="match" hidden>
    <div class="hud">
      <span class="round" id="roundName">16강</span>
      <span class="count" id="matchCount">1 / 7</span>
      <div class="bar"><i id="barFill"></i></div>
    </div>
    <div class="stage" id="stage">
      <button class="side a" id="sideA" type="button" aria-label="왼쪽 사진 선택">
        <img alt="" id="imgA" src="img/p01.jpg"><div class="stamp">통과</div>
        <div class="cap"><span class="tag">RED CORNER</span><span class="t" id="tA"></span><span class="d" id="dA"></span></div>
      </button>
      <button class="side b" id="sideB" type="button" aria-label="오른쪽 사진 선택">
        <img alt="" id="imgB" src="img/p02.jpg"><div class="stamp">통과</div>
        <div class="cap"><span class="tag">BLUE CORNER</span><span class="t" id="tB"></span><span class="d" id="dB"></span></div>
      </button>
      <div class="vs">VS</div>
    </div>
  </section>

  <section class="screen champ" id="champ" hidden>
    <div class="rays" aria-hidden="true"></div>
    <div class="eyebrow">CHAMPION · 수용소장</div>
    <div class="frame">
      <svg class="crown" viewBox="0 0 96 64" aria-hidden="true"><path d="M6 58 L12 16 L32 36 L48 4 L64 36 L84 16 L90 58 Z" fill="#ffc83d" stroke="#0e0c1d" stroke-width="4" stroke-linejoin="round"/><circle cx="12" cy="14" r="6" fill="#ff3d5a" stroke="#0e0c1d" stroke-width="3"/><circle cx="48" cy="6" r="6" fill="#2f8bff" stroke="#0e0c1d" stroke-width="3"/><circle cx="84" cy="14" r="6" fill="#ff3d5a" stroke="#0e0c1d" stroke-width="3"/></svg>
      <img alt="우승 사진" id="champImg" src="img/p01.jpg">
    </div>
    <h2 id="champT"></h2>
    <p class="d" id="champD"></p>
    <div class="trail"><span class="lbl">격파한 상대</span><div class="row" id="trail"></div></div>
    <div class="actions">
      <button class="btn primary" id="againBtn" type="button">다시 하기</button>
      <button class="btn" id="copyBtn" type="button">결과 복사</button>
    </div>
    <p class="toast" id="toast" aria-live="polite"></p>
  </section>
</div>

<div class="banner" id="banner" hidden><div class="inner"><img alt="" id="bannerImg" src="img/p01.jpg" hidden><span class="big" id="bannerBig"></span><span class="small" id="bannerSmall"></span></div></div>
<div class="flash" id="flash"></div>
<canvas id="fx"></canvas>

<script>
const PHOTOS = [
  { src: "img/p01.jpg", t: "고깃집 저격수", d: "삼겹살 다음 타겟은 너야" },
  { src: "img/p02.jpg", t: "노래방 2차의 증거", d: "뒤에서 춤추는 사람 정체 아직 미상" },
  { src: "img/p03.jpg", t: "웃음 측정 불가", d: "카메라 셔터가 웃음 속도를 못 따라감" },
  { src: "img/p04.jpg", t: "말 벽지 앞의 남자", d: "보라 조명, 그리고 뒤에서 지켜보는 말들" },
  { src: "img/p05.jpg", t: "건배 직전 붕괴", d: "소주잔은 지켰지만 표정은 못 지킴" },
  { src: "img/p06.jpg", t: "초근접 콧구멍 캠", d: "뒤에 누워 있는 사람 발까지 출연" },
  { src: "img/p07.jpg", t: "흔들린 영혼", d: "사진인가 인상파 회화인가" },
  { src: "img/p08.jpg", t: "수증기 속 실루엣", d: "다음 학기 증명사진으로 제출 예정" },
  { src: "img/p09.jpg", t: "1교시 직전의 얼굴", d: "한쪽 눈은 이미 퇴근함" },
  { src: "img/p10.jpg", t: "편의점 카운터 후광", d: "진열대 조명이 만든 성스러운 셀카" },
  { src: "img/p11.jpg", t: "샤우팅 대폭발", d: "이 사진에서 소리가 들린다면 정상" },
  { src: "img/p12.jpg", t: "안주 영접", d: "파스타 나오자 눈빛이 바뀐 순간" },
  { src: "img/p13.jpg", t: "북채 든 넘버원", d: "뭘 칠 건지는 본인도 모름" },
  { src: "img/p14.jpg", t: "눈이 사라지는 웃음", d: "웃는 순간 시야 0%" },
  { src: "img/p15.jpg", t: "코골이 현장 검거", d: "빨간 펜으로 증거 표시 완료" },
].map((p, i) => ({ ...p, id: i, beat: [] }));

const $ = (id) => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = (ms) => new Promise((r) => setTimeout(r, reduce ? Math.min(ms, 150) : ms));

// preload + intro reel
PHOTOS.forEach((p) => { const im = new Image(); im.src = p.src; });
const fillReel = (el, list) => {
  [...list, ...list].forEach((p) => { const im = document.createElement("img"); im.src = p.src; im.alt = ""; el.append(im); });
};
fillReel($("reel1"), PHOTOS.slice(0, 8));
fillReel($("reel2"), PHOTOS.slice(7));

// ---------- particles ----------
const cv = $("fx"), cx = cv.getContext("2d");
let parts = [], running = false, confettiUntil = 0;
const resize = () => { const r = devicePixelRatio || 1; cv.width = innerWidth * r; cv.height = innerHeight * r; cx.setTransform(r, 0, 0, r, 0, 0); };
addEventListener("resize", resize); resize();
const COLORS = ["#ffc83d", "#ff3d5a", "#2f8bff", "#f6f1ff"];
function burst(x, y, n = 60, colors = COLORS) {
  if (reduce) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 3 + Math.random() * 9;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, g: 0.25, life: 50 + Math.random() * 30, c: colors[i % colors.length], w: 3 + Math.random() * 5, h: 3 + Math.random() * 5, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4 });
  }
  loop();
}
function confetti(ms) { if (reduce) return; confettiUntil = performance.now() + ms; loop(); }
function loop() {
  if (running) return; running = true;
  const tick = (now) => {
    if (now < confettiUntil) {
      for (let i = 0; i < 4; i++) parts.push({ x: Math.random() * innerWidth, y: -10, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3, g: 0.03, life: 260, c: COLORS[(Math.random() * 4) | 0], w: 6 + Math.random() * 6, h: 4 + Math.random() * 4, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3 });
    }
    cx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter((p) => p.life-- > 0 && p.y < innerHeight + 30);
    for (const p of parts) {
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.vx *= 0.985; p.r += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.globalAlpha = Math.min(1, p.life / 30);
      cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore();
    }
    if (parts.length || now < confettiUntil) requestAnimationFrame(tick);
    else { running = false; cx.clearRect(0, 0, innerWidth, innerHeight); }
  };
  requestAnimationFrame(tick);
}
const flash = () => { const f = $("flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go"); };

// ---------- game ----------
let round = [], pairs = [], next = [], mi = 0, locked = true, totalMatches = 0, playedMatches = 0;
const shuffle = (a) => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const roundName = (n) => { let p = 1; while (p < n) p *= 2; return p === 2 ? "결승" : p === 4 ? "4강" : p + "강"; };

function show(id) { ["intro", "match", "champ"].forEach((s) => ($(s).hidden = s !== id)); }

async function banner(big, small, img) {
  const b = $("banner");
  $("bannerBig").textContent = big; $("bannerSmall").textContent = small || "";
  $("bannerImg").hidden = !img; if (img) $("bannerImg").src = img;
  b.hidden = false; b.classList.remove("show"); void b.offsetWidth; b.classList.add("show");
  await wait(1500); b.hidden = true;
}

async function startGame() {
  PHOTOS.forEach((p) => (p.beat = []));
  round = shuffle(PHOTOS);
  totalMatches = PHOTOS.length - 1; playedMatches = 0;
  show("match");
  $("stage").style.visibility = "hidden";
  await beginRound();
}

async function beginRound() {
  next = []; pairs = []; mi = 0;
  const list = [...round];
  const bye = list.length % 2 ? list.pop() : null;
  for (let i = 0; i < list.length; i += 2) pairs.push([list[i], list[i + 1]]);
  const name = roundName(round.length);
  $("roundName").textContent = name;
  await banner(name, name === "결승" ? "FINAL BATTLE" : `${pairs.length} MATCHES`);
  if (bye) { next.push(bye); await banner("부전승", bye.t, bye.src); }
  playMatch();
}

async function playMatch() {
  const [A, B] = pairs[mi];
  $("matchCount").textContent = `${mi + 1} / ${pairs.length}`;
  $("barFill").style.width = (playedMatches / totalMatches) * 100 + "%";
  $("imgA").src = A.src; $("tA").textContent = A.t; $("dA").textContent = A.d;
  $("imgB").src = B.src; $("tB").textContent = B.t; $("dB").textContent = B.d;
  const st = $("stage");
  st.style.visibility = "visible";
  st.className = "stage";
  ["sideA", "sideB"].forEach((id) => $(id).classList.remove("win", "lose"));
  void st.offsetWidth; st.classList.add("enter");
  await wait(600);
  const r = st.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 40, ["#ffc83d", "#f6f1ff"]);
  locked = false;
}

async function pick(which) {
  if (locked) return; locked = true;
  const [A, B] = pairs[mi];
  const win = which === 0 ? A : B, lose = which === 0 ? B : A;
  win.beat.push(lose); next.push(win); playedMatches++;
  const wEl = $(which === 0 ? "sideA" : "sideB"), lEl = $(which === 0 ? "sideB" : "sideA");
  $("stage").classList.add("done");
  wEl.classList.add("win"); lEl.classList.add("lose");
  flash();
  const r = wEl.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height * 0.4, 90);
  $("barFill").style.width = (playedMatches / totalMatches) * 100 + "%";
  await wait(1150);
  mi++;
  if (mi < pairs.length) return playMatch();
  $("stage").style.visibility = "hidden";
  if (next.length === 1) return champion(next[0]);
  round = next; beginRound();
}

let champ = null;
async function champion(w) {
  champ = w;
  await banner("우승", "WE HAVE A WINNER");
  $("champImg").src = w.src; $("champT").textContent = w.t; $("champD").textContent = w.d;
  const tr = $("trail"); tr.replaceChildren();
  w.beat.forEach((p) => { const im = document.createElement("img"); im.src = p.src; im.alt = p.t; im.title = p.t; tr.append(im); });
  $("toast").textContent = "";
  show("champ");
  flash(); confetti(5000);
  setTimeout(() => burst(innerWidth / 2, innerHeight * 0.35, 140), 300);
}

$("startBtn").addEventListener("click", startGame);
$("againBtn").addEventListener("click", startGame);
$("sideA").addEventListener("click", () => pick(0));
$("sideB").addEventListener("click", () => pick(1));
addEventListener("keydown", (e) => {
  if ($("match").hidden) return;
  if (e.key === "ArrowLeft" || e.key === "ArrowUp" || e.key === "1") pick(0);
  if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === "2") pick(1);
});
$("copyBtn").addEventListener("click", () => {
  const text = `🏆 내 수용소 월드컵 우승: "${champ.t}" (${champ.beat.length}연승)\n${champ.beat.map((p) => p.t).join(" → ")} 격파`;
  const ok = () => ($("toast").textContent = "복사했어. 단톡방에 붙여넣기!");
  const fail = () => ($("toast").textContent = text);
  try { navigator.clipboard.writeText(text).then(ok, fail); } catch { fail(); }
});
</script>
