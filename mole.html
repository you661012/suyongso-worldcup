<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수용소 두더지잡기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Bungee&family=Gothic+A1:wght@400;700;900&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
.field { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; }
.board {
  width: min(100%, 540px, 66vh);
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 4%;
  cursor: none;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.hole { position: relative; aspect-ratio: 1; }
.pit {
  position: absolute; left: 6%; right: 6%; bottom: 8%; height: 26%;
  border-radius: 50%;
  background: radial-gradient(ellipse at 50% 40%, #000 30%, var(--ink-2) 70%);
  box-shadow: 0 6px 0 var(--ink-3), inset 0 6px 12px #000;
}
.mask { position: absolute; left: 0; right: 0; top: -20%; bottom: 21%; overflow: hidden; pointer-events: none; }
.mole {
  position: absolute; left: 14%; width: 72%; bottom: 0;
  transform: translateY(105%);
  transition: transform 0.16s cubic-bezier(.2,1.4,.5,1);
  pointer-events: auto;
}
.mole.up { transform: translateY(8%); }
.mole .face {
  width: 100%; aspect-ratio: 1; border-radius: 50%;
  background-color: var(--ink-2);
  border: 4px solid var(--paper);
  position: relative; z-index: 1;
}
.mole .body {
  margin: -14% auto 0; width: 92%; height: 46px; border-radius: 40% 40% 0 0;
  background: repeating-linear-gradient(180deg, var(--paper) 0 8px, var(--ink) 8px 16px);
}
.mole.gold .face { border-color: var(--gold); box-shadow: 0 0 0 4px color-mix(in srgb, var(--gold) 50%, transparent); }
.mole.gold .face::after {
  content: "+5"; position: absolute; top: -6px; right: -8px;
  font-family: var(--arcade); font-size: 0.85rem; background: var(--gold); color: var(--ink);
  border-radius: 999px; padding: 2px 7px;
}
.mole.siren .face { border-color: var(--red); background: radial-gradient(circle at 40% 35%, #ff9aa8, var(--red) 45%, #8a0f22); animation: wail 0.3s steps(2) infinite; }
.mole.siren .face::after {
  content: "간수"; position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--display); font-size: 1.4rem; color: var(--paper);
}
.mole.siren .body { background: repeating-linear-gradient(180deg, #3a3a52 0 8px, #24243a 8px 16px); }
@keyframes wail { 50% { filter: brightness(1.5); } }
.mole.hit { transition: transform 0.25s ease-in 0.12s; }
.mole.hit .face { animation: squash 0.25s ease-out both; filter: grayscale(0.6) brightness(0.8); }
@keyframes squash { 0% { transform: scale(1.15, 0.7); } 60% { transform: scale(0.95, 1.05); } 100% { transform: scale(1, 0.85); } }
.rim {
  position: absolute; left: 6%; right: 6%; bottom: 8%; height: 13%;
  border-radius: 0 0 50% 50% / 0 0 100% 100%;
  background: var(--ink-3);
  pointer-events: none;
}
.pop {
  position: absolute; z-index: 5; pointer-events: none;
  font-family: var(--display); font-size: clamp(1.6rem, 6vw, 2.6rem);
  color: var(--paper); text-shadow: 3px 3px 0 var(--red);
  transform: translate(-50%, -50%);
  animation: pop 0.6s ease-out forwards;
}
.pop.gold { color: var(--gold); text-shadow: 3px 3px 0 var(--ink); }
.pop.bad { color: var(--red); text-shadow: 3px 3px 0 var(--ink); }
@keyframes pop { 0% { transform: translate(-50%, -50%) scale(0.4) rotate(-10deg); } 25% { transform: translate(-50%, -60%) scale(1.3) rotate(6deg); } 100% { transform: translate(-50%, -140%) scale(1); opacity: 0; } }

.hammer {
  position: fixed; z-index: 16; width: 64px; height: 64px; pointer-events: none;
  transform-origin: 80% 85%; transform: translate(-30%, -60%) rotate(20deg);
  transition: transform 0.08s;
}
.hammer.swing { transform: translate(-30%, -60%) rotate(-40deg); }
@media (hover: none) { .hammer { opacity: 0; } .hammer.swing { opacity: 1; } }

.timebar { height: 8px; border-radius: 99px; background: var(--ink-2); overflow: hidden; margin-block: 8px 4px; }
.timebar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--red), var(--gold)); transform-origin: left; }

.mvp { display: grid; justify-items: center; gap: 6px; }
.mvp .lbl { font-family: var(--arcade); font-size: 0.75rem; letter-spacing: 0.14em; color: var(--muted); }
.mvp .ph { width: 96px; height: 96px; border-radius: 50%; border: 4px solid var(--gold); background-color: var(--ink-2); }
.mvp .nm { font-family: var(--display); font-size: 1.2rem; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="./">← 게임센터</a>
    <span class="name">두더지잡기</span>
    <span class="spacer"></span>
    <span class="stat"><small>점수</small><span id="score">0</span></span>
    <span class="stat"><small>남은 시간</small><span id="time">30.0</span></span>
  </div>
  <div class="timebar"><i id="timebar"></i></div>
  <div class="field" id="field">
    <div class="board" id="board"></div>

    <div class="panel" id="startPanel">
      <div class="eyebrow">WHACK-A-FRIEND · 30 SEC</div>
      <h1 class="title-xl" style="font-size: clamp(3rem, 13vw, 6rem)">두더지<br>잡기</h1>
      <p class="lead">튀어나오는 친구 얼굴을 30초 동안 최대한 많이 때려.<br><b>황금 얼굴 +5</b> · <b style="color: var(--red)">간수 -3</b></p>
      <button class="btn primary big" id="startBtn" type="button">시작</button>
      <p class="toast" id="bestLine"></p>
    </div>

    <div class="panel" id="endPanel" hidden>
      <div class="eyebrow">TIME UP</div>
      <div class="score-big" id="finalScore">0</div>
      <p class="verdict" id="verdict"></p>
      <div class="mvp"><span class="lbl">가장 많이 맞은 사람</span><div class="ph" id="mvpFace"></div><span class="nm" id="mvpName"></span></div>
      <div class="actions">
        <button class="btn primary" id="againBtn" type="button">다시 하기</button>
        <button class="btn" id="copyBtn" type="button">결과 복사</button>
      </div>
      <p class="toast" id="toast"></p>
    </div>
  </div>
</div>
<svg class="hammer" id="hammer" viewBox="0 0 64 64" aria-hidden="true">
  <rect x="34" y="22" width="8" height="40" rx="3" fill="#c98a4b" stroke="#0e0c1d" stroke-width="3" transform="rotate(-35 38 42)"/>
  <rect x="6" y="6" width="40" height="22" rx="5" fill="#ff3d5a" stroke="#0e0c1d" stroke-width="3" transform="rotate(-35 26 17)"/>
</svg>

<script src="shared.js"></script>
<script>
const GAME_MS = 30000;
const board = $("board");
const holes = [];
for (let i = 0; i < 9; i++) {
  const h = document.createElement("div");
  h.className = "hole";
  h.innerHTML = '<div class="pit"></div><div class="mask"><div class="mole"><div class="face"></div><div class="body"></div></div></div><div class="rim"></div>';
  board.append(h);
  holes.push({ el: h, mole: h.querySelector(".mole"), face: h.querySelector(".face"), busy: false, kind: null, photo: null, timer: 0 });
}

let score = 0, running = false, endAt = 0, spawnTimer = 0, hits = new Map();

function setScore(v) { score = Math.max(0, v); $("score").textContent = score; }

function spawn() {
  if (!running) return;
  const left = Math.max(0, endAt - performance.now());
  const progress = 1 - left / GAME_MS;                 // 0 → 1
  const free = holes.filter((h) => !h.busy);
  const maxUp = progress < 0.4 ? 2 : 3;
  if (free.length && 9 - free.length < maxUp) {
    const h = pickOne(free);
    const r = Math.random();
    h.kind = r < 0.1 ? "gold" : r < 0.22 ? "siren" : "normal";
    h.photo = pickOne(PHOTOS);
    h.mole.className = "mole " + (h.kind === "normal" ? "" : h.kind);
    h.face.style.backgroundImage = "";
    if (h.kind !== "siren") { const s = h.face.offsetWidth; faceBg(h.face, h.photo, s, s, { pad: 0.05 }); }
    h.busy = true;
    requestAnimationFrame(() => h.mole.classList.add("up"));
    const upMs = 1100 - progress * 520;
    h.timer = setTimeout(() => hide(h), upMs);
  }
  spawnTimer = setTimeout(spawn, 720 - progress * 380 + rand(-120, 120));
}

function hide(h, delay = 0) {
  clearTimeout(h.timer);
  h.mole.classList.remove("up");
  setTimeout(() => { h.busy = false; h.mole.classList.remove("hit"); }, 260 + delay);
}

function popText(x, y, text, cls) {
  const r = $("field").getBoundingClientRect();
  const el = document.createElement("div");
  el.className = "pop " + (cls || ""); el.textContent = text;
  el.style.left = x - r.left + "px"; el.style.top = y - r.top + "px";
  $("field").append(el); setTimeout(() => el.remove(), 650);
}

const HIT_WORDS = ["퍽!", "빡!", "쾅!", "딱!", "뿅!"];
holes.forEach((h) => {
  h.mole.addEventListener("pointerdown", (e) => {
    if (!running || !h.mole.classList.contains("up") || h.mole.classList.contains("hit")) return;
    e.preventDefault();
    h.mole.classList.add("hit");
    clearTimeout(h.timer);
    setTimeout(() => hide(h, 120), 120);
    const x = e.clientX, y = e.clientY;
    if (h.kind === "siren") {
      setScore(score - 3); popText(x, y, "-3 삐용!", "bad"); FX.flash("red"); FX.shake(board);
      return;
    }
    const pts = h.kind === "gold" ? 5 : 1;
    setScore(score + pts);
    hits.set(h.photo, (hits.get(h.photo) || 0) + 1);
    popText(x, y, h.kind === "gold" ? "+5 대박!" : pickOne(HIT_WORDS), h.kind === "gold" ? "gold" : "");
    FX.burst(x, y, h.kind === "gold" ? 70 : 24, h.kind === "gold" ? ["#ffc83d", "#f6f1ff"] : undefined);
    if (h.kind === "gold") FX.flash();
  });
});

// 망치 커서
const hammer = $("hammer");
addEventListener("pointermove", (e) => { hammer.style.left = e.clientX + "px"; hammer.style.top = e.clientY + "px"; });
addEventListener("pointerdown", (e) => {
  hammer.style.left = e.clientX + "px"; hammer.style.top = e.clientY + "px";
  hammer.classList.add("swing"); setTimeout(() => hammer.classList.remove("swing"), 110);
});

function tickClock() {
  if (!running) return;
  const left = Math.max(0, endAt - performance.now());
  $("time").textContent = (left / 1000).toFixed(1);
  $("timebar").style.transform = `scaleX(${left / GAME_MS})`;
  if (left <= 0) return finish();
  requestAnimationFrame(tickClock);
}

function start() {
  setScore(0); hits = new Map();
  holes.forEach((h) => { clearTimeout(h.timer); h.busy = false; h.mole.className = "mole"; });
  $("startPanel").hidden = true; $("endPanel").hidden = true;
  running = true; endAt = performance.now() + GAME_MS;
  spawn(); tickClock();
}

const VERDICTS = [
  [0, "망치를 들긴 했니?"],
  [15, "수습 간수 수준"],
  [30, "수용소 정식 간수 임명"],
  [45, "두더지들이 너를 두려워함"],
  [60, "전설의 망치. 친구 얼굴 남아나질 않음"],
];
function finish() {
  running = false; clearTimeout(spawnTimer);
  holes.forEach((h) => hide(h));
  $("time").textContent = "0.0";
  const best = Best.get("mole");
  const isBest = score > best; if (isBest) Best.set("mole", score);
  $("finalScore").textContent = score;
  $("verdict").textContent = (isBest && best > 0 ? "신기록! " : "") + VERDICTS.filter(([s]) => score >= s).pop()[1];
  let mvp = null, cnt = 0; hits.forEach((c, p) => { if (c > cnt) { cnt = c; mvp = p; } });
  $("mvpFace").parentElement.hidden = !mvp;
  if (mvp) { faceBg($("mvpFace"), mvp, 96, 96, { pad: 0.05 }); $("mvpName").textContent = `${mvp.t} · ${cnt}대`; }
  $("toast").textContent = "";
  $("endPanel").hidden = false;
  FX.flash(); if (score >= 30) FX.confetti(3000);
  window._result = `🔨 수용소 두더지잡기 ${score}점` + (mvp ? `\n제일 많이 맞은 사람: ${mvp.t} (${cnt}대)` : "");
}

$("startBtn").addEventListener("click", start);
$("againBtn").addEventListener("click", start);
$("copyBtn").addEventListener("click", () => copyResult(window._result + "\n" + location.href, $("toast")));
const best = Best.get("mole"); if (best) $("bestLine").textContent = `내 최고 기록 ${best}점`;
loadImages();
</script>
</body>
</html>
